# Static analysis config. Run `flutter analyze` (or `dart analyze`).
# Lint list: https://dart.dev/lints

include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "lib/core/gen/**"
    - build/**
    - android/**
    - ios/**

# riverpod_lint 3 runs as an analysis_server_plugin.
plugins:
  riverpod_lint: ^3.1.9

linter:
  rules:
    # avoid_print: false
    # prefer_single_quotes: true
