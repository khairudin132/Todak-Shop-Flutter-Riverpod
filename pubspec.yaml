name: todak_shop
description: "A Flutter project for digital online Todak Shop"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  badges: ^4.0.1
  cached_network_image: ^4.0.6
  collection: ^1.19.1
  cupertino_icons: ^2.0.0
  dio: ^5.11.1
  dots_indicator: ^5.0.0
  get_it: ^9.3.0
  go_router: ^18.1.2
  hive: ^2.2.3
  flutter:
    sdk: flutter
  flutter_rating_bar: ^4.0.1
  flutter_riverpod: ^3.4.3
  jwt_decoder: ^2.0.1
  lottie: ^3.8.2
  mockito: ^5.8.1
  riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  shared_preferences: ^2.5.6
  shimmer: ^4.0.0
  talker_dio_logger: ^5.2.0

dev_dependencies:
  build_runner: ^2.16.2
  flutter_gen_runner: ^5.15.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  riverpod_generator: ^4.0.9
  riverpod_lint: ^3.1.9

flutter_gen:
  output: lib/core/gen

flutter:
  assets:
    - assets/
    - assets/lottie/
  uses-material-design: true
