name: Dart

on:
  # push:
  #   branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter --version
      - run: flutter pub get

      - name: Verify formatting
        run: dart format .

      - name: Analyze project source
        run: dart analyze --fatal-infos --fatal-warnings .
