name: Dart

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  analyze:
    runs-on: ubuntu-latest
    container:
      image: google/dart:stable # Use the official Dart Docker image

    steps:
      - uses: actions/checkout@v3

      - name: Install dependencies (if any)
        run: dart pub get # Only if you have a pubspec.yaml

      - name: Run Dart Analyze (Linter)
        run: dart analyze --fatal-infos --fatal-warnings . # Run the analyzer

      - name: Check formatting
        run: dart format --set-exit-if-changed .

